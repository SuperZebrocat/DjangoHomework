{% extends 'blog/base.html' %}
{% load blog_tags %}

{% block title %}Удаление статьи{% endblock %}

{% block content %}

<h2>Удалить статью</h2>
<p>Вы уверены, что хотите удалить "{{ post.title }}"?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Удалить</button>
    <a href="{% url 'blog:post_list' %}" class="btn btn-secondary">Отмена</a>
</form>
{% endblock %}
